
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#24231f">

    <title>Save the Date | Doménica y José Miguel</title>

    <!-- TIPOGRAFÍA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* ==============================
           CONFIGURACIÓN GENERAL
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #24231f;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            height: 100dvh;
        }

        /* ==============================
           INVITACIÓN RESPONSIVA
        ============================== */

        .invitacion {
            position: relative;
            width: 100%;
            max-width: 500px;

            height: 100vh;
            height: 100dvh;

            margin: 0 auto;
            overflow: hidden;
            isolation: isolate;
            background: #55534e;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* FOTOGRAFÍA DE FONDO */

        .foto-fondo {
            position: absolute;
            inset: 0;
            z-index: -2;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;
        }

        /* OSCURECIMIENTO */

        .invitacion::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;

           background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .invitacion::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;

            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.10) 0%,
                rgba(0, 0, 0, 0) 30%,
                rgba(0, 0, 0, 0.05) 60%,
                rgba(0, 0, 0, 0.35) 100%
            );

            pointer-events: none;
        }

        /* ==============================
           SAVE THE DATE Y NOMBRES
        ============================== */

.contenido {
    position: absolute;
    top: calc(20% + 110px);
    left: 0;

    width: 100%;
    padding: 0 12px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transform: translateY(-50%);
}


       .img-save {
    display: block;
    width: min(48%, 190px);
    max-height: 13dvh;
    height: auto;
    object-fit: contain;
    margin-bottom: 12px;
    transform: translateY(22px);
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.3));
}

        .img-nombres {
            display: block;

            width: 96%;
            max-width: 420px;
            max-height: 29dvh;
            height: auto;

            object-fit: contain;

            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        /* TEXTO ACCESIBLE */

        .texto-accesible {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ==============================
           FECHA DE LA BODA
        ============================== */

        .fecha {
            position: absolute;
            left: 0;

            /* Reserva espacio inferior */
            bottom: calc(7% + env(safe-area-inset-bottom, 0px));

            width: 100%;
            padding: 0 16px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-fecha {
            display: block;

            width: min(72%, 300px);
            max-height: 12dvh;
            height: auto;

            object-fit: contain;

            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
        }

        /* ==============================
           BOTÓN DE MÚSICA
        ============================== */

        .boton-musica {
            position: absolute;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 5;

            width: 30px;
            height: 30px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;

            background: rgba(30, 30, 28, 0.45);
            color: #ffffff;

            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 300;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition: background 0.3s ease, transform 0.3s ease;
        }

        .boton-musica:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.06);
        }

        .boton-musica:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        #iconoMusica {
            display: block;
            line-height: 1;
        }

        /* ==============================
           CELULARES DE ALTURA REDUCIDA
        ============================== */

        @media (max-height: 700px) {
            .contenido {
                    top: calc(15% + 90px);
            }

            .img-save {
                width: min(42%, 150px);
                max-height: 11dvh;
                margin-bottom: 5px;
            }

            .img-nombres {
                width: 88%;
                max-height: 25dvh;
            }

            .fecha {
                bottom: calc(6% + env(safe-area-inset-bottom, 0px));
            }

            .img-fecha {
                width: min(65%, 250px);
                max-height: 10dvh;
            }
        }

        /* ==============================
           CELULARES ESTRECHOS
        ============================== */

        @media (max-width: 360px) {
            .contenido {
                   top: calc(15% + 80px);
                padding-left: 8px;
                padding-right: 8px;
            }

            .img-save {
                width: min(48%, 150px);
            }

            .img-nombres {
                width: 94%;
            }

            .fecha {
                padding-left: 10px;
                padding-right: 10px;
            }

            .img-fecha {
                width: 72%;
                max-height: 9dvh;
            }
        }

        /* ==============================
           PANTALLAS MUY BAJAS
        ============================== */

        @media (max-height: 550px) {
            .contenido {
                 top: calc(12% + 70px);
            }

            .img-save {
                width: min(35%, 120px);
                max-height: 9dvh;
                margin-bottom: 3px;
            }

            .img-nombres {
                width: 78%;
                max-height: 22dvh;
            }

            .fecha {
                bottom: calc(5% + env(safe-area-inset-bottom, 0px));
            }

            .img-fecha {
                width: min(55%, 220px);
                max-height: 8dvh;
            }

            .boton-musica {
                width: 26px;
                height: 26px;
                right: 8px;
                bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* RESPETAR PREFERENCIAS DE MOVIMIENTO */

        @media (prefers-reduced-motion: reduce) {
            .boton-musica {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="invitacion">

        <!-- FOTOGRAFÍA PRINCIPAL -->
        <img
            src="WhatsApp Image 2026-10-10 at 15.17.25.jpeg"
            alt="Fotografía de Doménica y José Miguel"
            class="foto-fondo"
            fetchpriority="high"
        >

        <!-- SAVE THE DATE Y NOMBRES -->
        <section class="contenido" aria-label="Invitación de boda">

            <img
                src="save.png"
                alt="Save the Date"
                class="img-save"
            >

            <h1 class="texto-accesible">
                Doménica y José Miguel
            </h1>

            <img
                src="nombres.png"
                alt="Doménica y José Miguel"
                class="img-nombres"
            >

        </section>

        <!-- FECHA -->
        <section class="fecha" aria-label="Fecha de la boda">

            <img
                src="fecha.png"
                alt="19 de junio de 2027"
                class="img-fecha"
            >

        </section>

        <!-- BOTÓN DE MÚSICA -->
        <button
            type="button"
            class="boton-musica"
            id="botonMusica"
            aria-label="Reproducir música"
            aria-pressed="false"
            title="Reproducir música"
        >
            <span id="iconoMusica" aria-hidden="true">♫</span>
        </button>

        <!-- AUDIO -->
        <audio
            id="musica"
            src="musica.mp3"
            loop
            preload="none"
        ></audio>

    </main>

    <script>
        // ==============================
        // CONTROL DE MÚSICA
        // ==============================

        const botonMusica = document.getElementById('botonMusica');
        const iconoMusica = document.getElementById('iconoMusica');
        const musica = document.getElementById('musica');

        function actualizarBoton(reproduciendo) {
            if (reproduciendo) {
                iconoMusica.textContent = 'Ⅱ';
                botonMusica.setAttribute('aria-label', 'Pausar música');
                botonMusica.setAttribute('aria-pressed', 'true');
                botonMusica.title = 'Pausar música';
            } else {
                iconoMusica.textContent = '♫';
                botonMusica.setAttribute('aria-label', 'Reproducir música');
                botonMusica.setAttribute('aria-pressed', 'false');
                botonMusica.title = 'Reproducir música';
            }
        }

        botonMusica.addEventListener('click', async () => {
            if (musica.paused) {
                try {
                    await musica.play();
                    actualizarBoton(true);
                } catch (error) {
                    actualizarBoton(false);
                    console.error(
                        'No se pudo reproducir la música.',
                        error
                    );
                }
            } else {
                musica.pause();
                actualizarBoton(false);
            }
        });

        musica.addEventListener('play', () => actualizarBoton(true));
        musica.addEventListener('pause', () => actualizarBoton(false));
        musica.addEventListener('ended', () => actualizarBoton(false));
    </script>

</body>
</html>
